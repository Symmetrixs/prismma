# Render deployment blueprint.
#
# This matches the service breakdown in Prismma_Hosting_Cost_Overview.pdf exactly:
#   - backend (FastAPI):    Render Web Service, Docker
#   - homepage (Next.js):   Render Web Service, Docker (needs a running server for news + contact)
#   - system (React+Vite):  Render Static Site (free, unlimited, no server needed)
#   - database:             Supabase, separate provider, not part of this file
#
# Local dev via docker-compose.yml is unaffected by this file and keeps working as-is.
# Field names verified against Render's current Blueprint docs (runtime, not the deprecated env field).
# Cross-service URLs (NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SYSTEM_URL, NEXT_PUBLIC_SITE_URL,
# API_URL, VITE_API_URL, VITE_HOMEPAGE_URL) are auto-wired via fromService, no manual entry needed.
# CORS_ORIGINS, DATABASE_URL, JWT_SECRET_KEY, SMTP_*, HR_EMAIL, SUPABASE_URL, SUPABASE_SERVICE_KEY,
# and NEXT_PUBLIC_SUPABASE_URL are still sync: false and need real values pasted into Render's dashboard.

services:
  - type: web
    name: prismma-backend
    runtime: docker
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: HR_EMAIL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  - type: web
    name: prismma-homepage
    runtime: docker
    dockerfilePath: ./docker/homepage.Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: prismma-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SYSTEM_URL
        fromService:
          name: prismma-system
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          name: prismma-homepage
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: API_URL
        fromService:
          name: prismma-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: prismma-system
    runtime: static
    buildCommand: cd system && npm install && npm run build
    staticPublishPath: ./system/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: prismma-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_HOMEPAGE_URL
        fromService:
          name: prismma-homepage
          type: web
          envVarKey: RENDER_EXTERNAL_URL
